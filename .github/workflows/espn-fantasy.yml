name: ESPN Fantasy Snapshot

# Fetches a fresh, complete snapshot of the ESPN fantasy league directly from
# ESPN's API on a GitHub runner. This deliberately bypasses any web retrieval or
# cache layer: the runner makes the HTTP calls itself, sends the headers ESPN
# requires (X-Fantasy-Filter for the player pool), and discovers the current
# scoringPeriodId rather than hard-coding a week.
#
# Results are published two ways:
#   1. committed to the data/ directory on the default branch (easiest to read)
#   2. uploaded as the "espn-fantasy-data" workflow artifact (includes raw/)

on:
  workflow_dispatch:
    inputs:
      scoring_period:
        description: "Override scoringPeriodId (leave blank to auto-detect)"
        required: false
        type: string
      commit_data:
        description: "Commit refreshed JSON to the data/ directory"
        required: false
        default: true
        type: boolean
  schedule:
    # Every six hours. Cron is UTC; GitHub may delay scheduled runs under load.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_espn.py"
      - ".github/workflows/espn-fantasy.yml"

permissions:
  contents: write

# Never let two snapshots race to commit the same files.
concurrency:
  group: espn-fantasy-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Fetch ESPN league snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ESPN_LEAGUE_ID: "1787259003"
      # Pinned on purpose. The script can auto-detect the season, but ESPN does
      # not publish a new season until roughly midsummer, so auto-detection would
      # break during the offseason. Bump this to 2027 when that season opens.
      ESPN_SEASON: "2026"
      ESPN_OUT_DIR: data
      ESPN_SCORING_PERIOD: ${{ inputs.scoring_period }}
      # Only needed if the league is ever made private. Absent secrets resolve to
      # empty strings, which the script treats as "public league, no cookies".
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Check out the current branch tip rather than the SHA this run was
          # pinned to at creation time. Scheduled runs pin GITHUB_SHA when they
          # are queued, and a re-run reuses that same SHA, so without this the
          # runner can execute an old copy of scripts/ and start from a data
          # baseline several snapshots behind. Resolving the ref at run time
          # keeps both current and lets the push fast-forward normally.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch ESPN data
        id: fetch
        run: python scripts/fetch_espn.py

      - name: Summarize snapshot
        # Runs even on failure so the job summary always explains what happened.
        if: always()
        run: python scripts/summarize.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: espn-fantasy-data
          path: data/
          retention-days: 30
          if-no-files-found: error

      - name: Commit refreshed data
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.commit_data)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PERIOD=$(python -c "import json;print(json.load(open('data/metadata.json'))['scoringPeriodId'])")
          STAMP=$(python -c "import json;print(json.load(open('data/metadata.json'))['fetched_at'])")

          # Never merge or rebase generated data. Every file in data/ is rewritten
          # in full on each run, so combining two snapshots conflicts in every file
          # and there is nothing meaningful to resolve. Instead, move HEAD to the
          # current remote tip while leaving the working tree alone, so the freshly
          # fetched files become a single new commit on top of whatever is on the
          # branch now. The newest snapshot always wins, which is what we want.
          #
          # This also covers a stale checkout: a re-run reuses the original commit
          # SHA, so the runner can start from a commit that is several snapshots
          # behind. Re-fetching inside the loop keeps that case correct too.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --soft "origin/${GITHUB_REF_NAME}"

            # data/raw is gitignored, so only the normalized files are staged.
            # Staging just data/ preserves any non-data commits already on origin.
            git add data

            if git diff --cached --quiet; then
              echo "Snapshot is identical to origin; nothing to commit."
              exit 0
            fi

            git commit --quiet -m "ESPN snapshot: week ${PERIOD} @ ${STAMP} [skip ci]"

            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; retrying against the new tip."
            sleep $(( attempt * 3 ))
          done

          echo "::error::Could not push refreshed data after 5 attempts."
          exit 1
